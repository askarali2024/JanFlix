<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f111a" />
  <title>JanFlix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><polygon points='38,28 38,72 74,50' fill='white'/></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ═══ Header ═══ -->
  <header class="header">
    <div class="logo" title="JanFlix">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </span>
      <span class="logo-text">JAN<em>FLIX</em></span>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="searchInput" type="text" placeholder="Search title, genre, year…" autocomplete="off" spellcheck="false" />
      <button id="searchClear" class="search-clear" hidden>&times;</button>
    </div>

    <div class="header-actions">
      <button id="scanBtn" class="btn btn-ghost" title="Rescan media folders">
        <svg id="scanIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        <span>Scan Library</span>
      </button>
      <button id="qrBtn" class="btn btn-primary" title="Show LAN QR code">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM19 14h2M14 19h2M18 18h3v3h-3z"/></svg>
        <span>QR</span>
      </button>
    </div>
  </header>

  <!-- ═══ Main ═══ -->
  <main class="main">
    <section id="continueSection" class="row-section" hidden>
      <h2 class="row-title">Continue Watching</h2>
      <div id="continueRow" class="card-row"></div>
    </section>

    <div class="pills-bar">
      <div id="pills" class="pills"></div>
      <div id="libraryCount" class="lib-count"></div>
    </div>

    <section id="grid" class="grid"></section>

    <div id="emptyState" class="empty" hidden>
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5h16v14H4z"/><path d="M9 5v14M15 5v14M4 10h16M4 15h16"/></svg>
      </div>
      <h3 id="emptyTitle">No movies found</h3>
      <p id="emptyHint">Drop your video files into the configured media folder and hit <b>Scan Library</b>.</p>
    </div>
  </main>

  <!-- ═══ Detail Modal ═══ -->
  <div id="detailModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close aria-label="Close">&times;</button>
      <div class="detail-backdrop" id="detailBackdrop"></div>
      <div class="detail-body">
        <h2 id="detailTitle"></h2>
        <div class="detail-meta" id="detailMeta"></div>
        <p class="detail-overview" id="detailOverview"></p>
        <div class="detail-facts" id="detailFacts"></div>
        <div class="detail-actions">
          <button id="detailPlay" class="btn btn-primary btn-lg">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span id="detailPlayLabel">Play</span>
          </button>
          <a id="detailDownload" class="btn btn-ghost btn-lg" download>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span>Download</span>
          </a>
          <button id="detailReset" class="btn btn-ghost" hidden>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 2.64-6.36M3 3v6h6"/></svg>
            <span>Start Over</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Player ═══ -->
  <div id="player" class="player" hidden>
    <div class="player-top">
      <button id="playerClose" class="player-close" aria-label="Close player">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="player-title" id="playerTitle"></div>
      <button id="compatBtn" class="btn btn-ghost btn-sm" hidden title="Remux audio to AAC via ffmpeg for browsers that can't decode this file">⚡ Compatibility Stream: Off</button>
    </div>
    <video id="video" controls playsinline preload="metadata"></video>
  </div>

  <!-- ═══ QR Modal ═══ -->
  <div id="qrModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card qr-card">
      <button class="modal-close" data-close aria-label="Close">&times;</button>
      <h2>Watch on your phone</h2>
      <p class="qr-sub">Scan this with any device on the same Wi-Fi / LAN.</p>
      <img id="qrImage" alt="LAN QR code" />
      <div class="qr-url" id="qrUrl"></div>
      <button id="qrCopy" class="btn btn-ghost">Copy LAN address</button>
    </div>
  </div>

  <!-- ═══ Toast ═══ -->
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
